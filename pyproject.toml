[tool.black]
line-length = 100
target-version = ["py312"]
 
[tool.ruff]
line-length = 100
target-version = "py312"
 
[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]
 
[tool.ruff.lint.per-file-ignores]
# Split settings files intentionally use `from .base import *`, so names like
# `env` are defined via star import; ruff can't trace those statically.
"config/settings/*.py" = ["F403", "F405"]
 
[tool.mypy]
python_version = "3.12"
plugins = ["mypy_django_plugin.main"]
ignore_missing_imports = true
exclude = ["migrations/"]
 
[tool.django-stubs]
django_settings_module = "config.settings.development"